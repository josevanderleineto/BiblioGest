<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>BiblioGest Launcher</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      margin: 0;
      padding: 24px;
      display: flex;
      flex-direction: column;
      height: 100vh;
      box-sizing: border-box;
    }
    .header {
      display: flex;
      items-center: center;
      gap: 16px;
      margin-bottom: 24px;
    }
    .logo {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, #0284c7, #4f46e5);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 24px;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.4);
    }
    .status-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 24px;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    button {
      padding: 12px 16px;
      border-radius: 8px;
      border: none;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-primary { background: #0284c7; color: white; }
    .btn-primary:hover { background: #0369a1; }
    .btn-danger { background: #e11d48; color: white; }
    .btn-secondary { background: #334155; color: #f8fafc; }
    .btn-secondary:hover { background: #475569; }
    .badge {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #22c55e;
      margin-right: 6px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">B</div>
    <div>
      <h2 style="margin: 0; font-size: 20px;">BiblioGest Launcher</h2>
      <span style="color: #94a3b8; font-size: 12px;">Gerenciador do Servidor Local</span>
    </div>
  </div>

  <div class="status-card">
    <div style="font-size: 12px; color: #94a3b8; text-transform: uppercase; font-weight: 700; margin-bottom: 8px;">Status do Sistema</div>
    <div id="status-text" style="font-size: 14px; font-weight: 600;">
      <span class="badge"></span> Servidor Pronto (http://localhost:3000)
    </div>
  </div>

  <div class="grid">
    <button class="btn-primary" onclick="startServer()">▶ Abrir BiblioGest</button>
    <button class="btn-danger" onclick="stopServer()">⏹ Parar Servidor</button>
    <button class="btn-secondary" onclick="openBrowser()">🌐 Abrir no Navegador</button>
    <button class="btn-secondary" onclick="openDataFolder()">📁 Pasta de Dados</button>
  </div>

  <script>
    const { ipcRenderer } = require('electron');

    function startServer() {
      document.getElementById('status-text').innerText = 'Iniciando servidor local...';
      ipcRenderer.send('start-server');
    }

    function stopServer() {
      ipcRenderer.send('stop-server');
    }

    function openBrowser() {
      ipcRenderer.send('open-browser');
    }

    function openDataFolder() {
      ipcRenderer.send('open-data-folder');
    }

    ipcRenderer.on('server-status', (event, data) => {
      document.getElementById('status-text').innerText = data.message;
    });
  </script>
</body>
</html>
